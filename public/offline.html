<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<title>Reconnecting – MailOS</title>
<style>
:root{--bg:#0e1013;--card:#15181b;--tx:#e8eaed;--mut:#9aa0a6;--a:#14b8a6;--ink:#04201d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
.box{max-width:360px}
img{width:76px;height:76px;border-radius:20px;animation:float 3s ease-in-out infinite}
h1{margin:22px 0 6px;font-size:22px}
p{margin:0;color:var(--mut)}
.ur{margin-top:6px;font-size:15px;direction:rtl}
.dots{display:inline-flex;gap:6px;margin:22px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--a);animation:pulse 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
button{display:block;margin:0 auto;padding:12px 24px;border:0;border-radius:12px;background:var(--a);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer}
small{display:block;margin-top:14px;color:var(--mut);font-size:12px}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){img,.dots i{animation:none}}
</style>
</head>
<body>
<main class="box">
	<img src="/icon-192.png" alt="MailOS">
	<h1>Reconnecting to MailOS…</h1>
	<p>Your internet connection dropped for a moment. MailOS will open again by itself as soon as it's back.</p>
	<p class="ur">انٹرنیٹ کنکشن عارضی طور پر منقطع ہوا ہے۔ کنکشن بحال ہوتے ہی MailOS خود کھل جائے گی۔</p>
	<div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
	<button type="button" id="retry">Try again</button>
	<small id="status" role="status"></small>
</main>
<script>
(function () {
	var status = document.getElementById("status");
	var tries = 0;
	function reopen() { location.reload(); }
	function check() {
		tries += 1;
		status.textContent = "Checking… (" + tries + ")";
		fetch("/robots.txt?ping=" + Date.now(), { cache: "no-store" })
			.then(function (r) { if (r.ok) reopen(); else status.textContent = "Still waiting for the connection…"; })
			.catch(function () { status.textContent = "Still waiting for the connection…"; });
	}
	document.getElementById("retry").addEventListener("click", reopen);
	window.addEventListener("online", function () { setTimeout(reopen, 400); });
	setInterval(check, 5000);
})();
</script>
</body>
</html>
