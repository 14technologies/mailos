# MailOS bridge on a VPS. Copy .env.example to .env and set your values first.
services:
  bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TLS_CERT: /certs/live/${BRIDGE_HOSTNAME}/fullchain.pem
      TLS_KEY: /certs/live/${BRIDGE_HOSTNAME}/privkey.pem
      # The container runs as a non-root user, so it listens on high ports mapped below.
      POP3S_PORT: "1995"
      SMTPS_PORT: "1465"
      SUBMISSION_PORT: "1587"
      POP3_PORT: "1110"
    volumes:
      - ./letsencrypt:/certs:ro
    ports:
      - "995:1995"   # POP3 over TLS (receive)
      - "465:1465"   # SMTP over TLS (send)
      - "587:1587"   # SMTP submission with STARTTLS (send)
      - "110:1110"   # POP3 with STLS (receive)

  # Free Let's Encrypt certificate. Run once:  docker compose run --rm -p 80:80 certbot certonly --standalone -d $BRIDGE_HOSTNAME && sudo chown -R 1000:1000 letsencrypt
  # Renewal (cron, e.g. weekly):              docker compose run --rm -p 80:80 certbot renew && sudo chown -R 1000:1000 letsencrypt && docker compose restart bridge
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - ./letsencrypt:/etc/letsencrypt
